name: checks

# The build-time instruments from the code repo, each earning its place by
# catching something the others missed: verify.py (1,045 pages announcing the
# wrong catalogue), phone_audit.py (every watch page scrolling 528px sideways),
# behaviour_test.py (a status pill that could never appear), and the syntax gate.
#
# This repo holds no code. It exists so Actions minutes bill to GirisankarG, and
# it is PUBLIC because GitHub-hosted runners are unmetered on public repos.
#
# FROM 2026-09-13 TO 09-23 EVERY RUN OF THIS FILE DIED AT STEP ONE with "Input
# required and not supplied: token", because CODE_REPO_PAT was never created,
# and nothing said so: GitHub's failure notice goes to the account that owns
# this repo, which nobody reads. So now:
#   - the first step refuses to start and NAMES every missing secret,
#   - the checks after a good build run independently, so one failure does not
#     hide the others behind "skipped",
#   - the report step always runs, mails the failing step by name, and exits 1.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # This repo first: it holds the mailer, which must work even when the
      # private checkout does not.
      - uses: actions/checkout@v4

      - name: Refuse to start without the secrets
        id: require-secrets
        env:
          CODE_REPO_PAT: ${{ secrets.CODE_REPO_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: |
          missing=""
          for v in CODE_REPO_PAT RESEND_API_KEY ALERT_EMAIL ALERT_FROM; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "::error::not set on this repository:$missing"
            exit 1
          fi

      - name: Check out akv2011/stream-site
        id: checkout-code
        uses: actions/checkout@v4
        with:
          repository: akv2011/stream-site
          ref: main
          token: ${{ secrets.CODE_REPO_PAT }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        id: install
        working-directory: code
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      # Cheapest gate first: a file that does not parse fails in seconds.
      - name: Python syntax
        id: syntax
        working-directory: code
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          for f in pathlib.Path('.').rglob('*.py'):
              if '.git' in f.parts:
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  print(f"{f}:{e.lineno}: {e.msg}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      # Images are gitignored, so the build runs without artwork. Every check
      # below asserts markup, behaviour or layout, never pixels.
      - name: Build
        id: build
        working-directory: code
        run: python site/build.py --base-url https://flixshows.me

      # Deploys run from a laptop, not from git. On 2026-09-24 the live site
      # carried 98 titles no pushed commit builds, so these checks were testing
      # a site nobody served. Same-build comparison: 0 difference when in sync.
      - name: Deployed site matches pushed code
        id: drift
        if: steps.build.outcome == 'success'
        run: >
          python scripts/drift_check.py --built code/dist/search-index.json
          --live https://flixshows.me/search-index.json --summary drift.json

      # Completeness as an identity, not a threshold: built - noindex == sitemap.
      # Exact on the deployed build (13,631 - 5,433 = 8,198).
      - name: Sitemap identity
        id: identity
        if: steps.build.outcome == 'success'
        run: python scripts/identity_check.py --dist code/dist --summary identity.json

      - name: Structure, SEO and contrast
        id: verify
        if: steps.build.outcome == 'success'
        working-directory: code
        run: python scripts/verify.py

      - name: Phone layout
        id: phone-audit
        if: steps.build.outcome == 'success'
        working-directory: code
        run: python scripts/phone_audit.py 360 390 414

      - name: Behaviour
        id: behaviour
        if: steps.build.outcome == 'success'
        working-directory: code
        run: python scripts/behaviour_test.py

      # Mail state: a failure is mailed when it starts, changes kind or recovers,
      # and at most daily while unchanged. The run stays red regardless.
      - uses: actions/cache/restore@v4
        if: always()
        with:
          path: mailstate
          key: checks-mail-${{ github.run_id }}
          restore-keys: checks-mail-

      - name: Report
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python scripts/report.py --suite "Build checks" --state mailstate/mail.json

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: mailstate
          key: checks-mail-${{ github.run_id }}
